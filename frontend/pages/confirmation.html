<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Confirmation — O2 Tickets</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="site-nav"></div>
  <main class="mx-auto max-w-2xl px-4 py-8">
    <h1 class="text-2xl font-extrabold text-teal-800">Payment successful</h1>
    <p class="mt-2 text-slate-600">Your tickets were generated. If SMTP is not configured, use the email preview link below.</p>
    <div id="email-preview" class="hidden mt-4"></div>
    <div id="tickets" class="mt-6 space-y-4"></div>
    <a href="/pages/dashboard.html" class="btn-secondary inline-flex mt-6">Go to my tickets</a>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/emailPreview.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    initNav('dashboard');
    const raw = sessionStorage.getItem('lastConfirmation');
    if (!raw) {
      document.getElementById('tickets').innerHTML = '<p>No confirmation data. <a class="underline text-rose-700" href="/pages/dashboard.html">View dashboard</a></p>';
    } else {
      const data = JSON.parse(raw);
      showEmailPreview('email-preview', data);
      document.getElementById('tickets').innerHTML = (data.tickets || []).map((t) => `
        <article class="rounded-2xl border border-slate-200 bg-white p-5 fade-in">
          <div class="flex flex-col sm:flex-row gap-4 items-start">
            <img src="${t.qrDataUrl}" alt="QR for ${t.ticketNumber}" class="w-40 h-40 border border-slate-100 rounded-xl" />
            <div>
              <p class="text-xs uppercase tracking-wide text-slate-500">Ticket number</p>
              <p class="font-mono font-bold text-lg">${t.ticketNumber}</p>
              <p class="mt-2 font-semibold">${t.ticketTypeCode}</p>
              <p class="text-sm text-slate-600">${t.attendees.map((a) => a.firstName + ' ' + a.lastName).join(', ')}</p>
              <p class="mt-2 font-bold">Paid £${Number(t.amountPaid).toFixed(2)}</p>
              <a class="btn-ghost text-sm mt-3 inline-flex" download="${t.ticketNumber}.png" href="${t.qrDataUrl}">Download QR</a>
            </div>
          </div>
        </article>
      `).join('');
    }
  </script>
</body>
</html>
