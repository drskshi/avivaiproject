<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Reset password — O2 Tickets</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="site-nav"></div>
  <main class="mx-auto max-w-md px-4 py-10">
    <h1 class="text-2xl font-extrabold tracking-tight" data-content="auth.resetTitle">Reset your password</h1>
    <p class="mt-2 text-slate-600" data-content="auth.resetHelp">Enter the 6-digit code and a new password.</p>
    <p id="msg" class="hidden mt-4 rounded-xl p-3 text-sm"></p>
    <div id="email-preview" class="hidden mt-4"></div>

    <form id="reset-form" class="mt-6 space-y-3">
      <input class="input-field" name="email" type="email" placeholder="Email" required />
      <input class="input-field tracking-[0.35em] text-center text-xl font-bold" name="otp" inputmode="numeric" maxlength="6" placeholder="••••••" />
      <input class="input-field" name="newPassword" type="password" placeholder="New password (min 6)" required minlength="6" />
      <input class="input-field" name="confirmPassword" type="password" placeholder="Confirm new password" required minlength="6" />
      <button class="btn-primary w-full min-h-[48px]" type="submit">Update password</button>
    </form>

    <button id="resend-reset" type="button" class="btn-ghost w-full mt-3 min-h-[44px]">Resend reset email</button>
    <p class="mt-6 text-sm text-slate-500">
      <a class="text-rose-700 font-semibold underline" href="/pages/auth.html">Back to login</a>
    </p>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/content.js"></script>
  <script src="/js/emailPreview.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    initNav('');
    loadSiteContent();

    const params = new URLSearchParams(location.search);
    const form = document.getElementById('reset-form');
    if (params.get('email')) form.email.value = params.get('email');
    const linkToken = params.get('token');
    showEmailPreview('email-preview', {
      demoOtp: sessionStorage.getItem('pendingResetOtp'),
      emailPreviewUrl: sessionStorage.getItem('pendingResetPreview'),
    });
    if (sessionStorage.getItem('pendingResetOtp')) {
      form.otp.value = sessionStorage.getItem('pendingResetOtp');
    }

    function show(text, ok = false) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = `mt-4 rounded-xl p-3 text-sm ${ok ? 'bg-teal-50 text-teal-800' : 'bg-rose-50 text-rose-800'}`;
      el.classList.remove('hidden');
    }

    // If opened from email link with token, OTP field can stay optional
    if (linkToken) {
      form.otp.placeholder = 'Optional if you used the email link';
      show('Reset link detected — enter a new password to continue.', true);
    }

    form.onsubmit = async (e) => {
      e.preventDefault();
      const email = form.email.value.trim();
      const newPassword = form.newPassword.value;
      const confirmPassword = form.confirmPassword.value;
      if (newPassword !== confirmPassword) {
        return show('Passwords do not match.', false);
      }
      const otp = form.otp.value.trim();
      if (!otp && !linkToken) {
        return show('Enter the 6-digit code from your email.', false);
      }
      try {
        const body = { email, newPassword };
        if (otp) body.otp = otp;
        else body.token = linkToken;
        const data = await API.post('/auth/reset-password', body);
        show(data.message, true);
        setTimeout(() => { location.href = '/pages/auth.html'; }, 900);
      } catch (err) {
        show(err.message, false);
      }
    };

    document.getElementById('resend-reset').onclick = async () => {
      const email = form.email.value.trim();
      if (!email) return show('Enter your email first.', false);
      try {
        const data = await API.post('/auth/forgot-password', { email });
        show(data.message, true);
        showEmailPreview('email-preview', data);
        if (data.demoOtp) form.otp.value = data.demoOtp;
      } catch (err) {
        show(err.message, false);
      }
    };
  </script>
</body>
</html>
