<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Forgot password — O2 Tickets</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="site-nav"></div>
  <main class="mx-auto max-w-md px-4 py-10">
    <h1 class="text-2xl font-extrabold tracking-tight" data-content="auth.forgotTitle">Forgot password</h1>
    <p class="mt-2 text-slate-600" data-content="auth.forgotHelp">Enter your account email and we’ll send a reset code.</p>
    <p id="msg" class="hidden mt-4 rounded-xl p-3 text-sm"></p>
    <div id="email-preview" class="hidden mt-4"></div>

    <form id="forgot-form" class="mt-6 space-y-3">
      <input class="input-field" name="email" type="email" placeholder="Account email" required />
      <button class="btn-primary w-full min-h-[48px]" type="submit">Send reset code</button>
    </form>

    <p class="mt-6 text-sm text-slate-500">
      <a class="text-rose-700 font-semibold underline" href="/pages/reset-password.html">Already have a code?</a>
      ·
      <a class="text-rose-700 font-semibold underline" href="/pages/auth.html">Back to login</a>
    </p>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/content.js"></script>
  <script src="/js/emailPreview.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    initNav('');
    loadSiteContent();

    function show(text, ok = false) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = `mt-4 rounded-xl p-3 text-sm ${ok ? 'bg-teal-50 text-teal-800' : 'bg-rose-50 text-rose-800'}`;
      el.classList.remove('hidden');
    }

    document.getElementById('forgot-form').onsubmit = async (e) => {
      e.preventDefault();
      const email = e.target.email.value.trim();
      try {
        const data = await API.post('/auth/forgot-password', { email });
        show(data.message, true);
        showEmailPreview('email-preview', data);
        if (data.demoOtp) sessionStorage.setItem('pendingResetOtp', data.demoOtp);
        if (data.emailPreviewUrl) sessionStorage.setItem('pendingResetPreview', data.emailPreviewUrl);
        setTimeout(() => {
          location.href = `/pages/reset-password.html?email=${encodeURIComponent(email)}`;
        }, data.emailPreviewUrl || data.demoOtp ? 2500 : 800);
      } catch (err) {
        show(err.message, false);
      }
    };
  </script>
</body>
</html>
