<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>My tickets — O2 Tickets</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="site-nav"></div>
  <main class="mx-auto max-w-3xl px-4 py-8">
    <h1 class="text-2xl font-extrabold">My tickets</h1>
    <p class="mt-2 text-slate-600">Cancel eligible tickets or request an upgrade.</p>
    <p id="msg" class="hidden mt-4 rounded-xl p-3 text-sm"></p>
    <div id="list" class="mt-6 space-y-4"></div>

    <section class="mt-10 rounded-2xl border border-rose-200 bg-rose-50/60 p-5">
      <h2 class="font-extrabold text-rose-900">Delete my account</h2>
      <p class="mt-2 text-sm text-rose-900/80">This permanently removes your account, tickets, orders, and payments from the database. This cannot be undone.</p>
      <button id="delete-account-btn" type="button" class="btn-ghost mt-4 min-h-[48px] text-rose-700 border-rose-300">Delete my account</button>
    </section>
  </main>

  <div id="amend-modal" class="hidden fixed inset-0 z-50 bg-black/50 p-4">
    <div class="mx-auto mt-20 max-w-md rounded-2xl bg-white p-5">
      <h2 class="font-extrabold text-lg">Upgrade ticket</h2>
      <select id="upgrade-select" class="input-field mt-3"></select>
      <div class="mt-4 flex gap-2">
        <button id="amend-confirm" class="btn-primary flex-1" type="button">Confirm upgrade</button>
        <button id="amend-cancel" class="btn-ghost flex-1" type="button">Close</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    initNav('dashboard');
    if (!Auth.requireAuth()) throw new Error('auth');

    let amendId = null;
    const ranks = { RESTRICTED: 1, STANDARD: 2, GROUP_STANDARD: 2, VIP: 3 };

    function flash(text, ok = true) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = `mt-4 rounded-xl p-3 text-sm ${ok ? 'bg-teal-50 text-teal-800' : 'bg-rose-50 text-rose-800'}`;
      el.classList.remove('hidden');
    }

    async function load() {
      const data = await API.get('/tickets/mine');
      const types = await API.get('/ticket-types');
      const list = document.getElementById('list');
      if (!data.tickets.length) {
        list.innerHTML = '<p class="text-slate-600">No tickets yet. <a class="underline text-rose-700" href="/pages/tickets.html">Buy tickets</a></p>';
        return;
      }
      list.innerHTML = data.tickets.map((t) => `
        <article class="rounded-2xl border border-slate-200 bg-white p-4 sm:p-5">
          <div class="flex flex-col sm:flex-row gap-4">
            <img src="${t.qrDataUrl}" alt="QR" class="w-28 h-28 rounded-lg border" />
            <div class="flex-1">
              <p class="font-mono font-bold">${t.ticketNumber}</p>
              <p class="mt-1 font-semibold">${t.ticketTypeCode} · <span class="badge">${t.status}</span></p>
              <p class="text-sm text-slate-600">${t.attendees.map((a) => a.firstName + ' ' + a.lastName).join(', ')}</p>
              <p class="mt-1 text-sm">Paid £${Number(t.amountPaid).toFixed(2)}</p>
              ${t.status !== 'cancelled' ? `
              <div class="mt-3 flex flex-col sm:flex-row gap-2">
                <button data-cancel="${t._id}" class="btn-ghost text-sm" type="button">Cancel / refund</button>
                <button data-amend="${t._id}" data-code="${t.ticketTypeCode}" class="btn-secondary text-sm" type="button">Upgrade</button>
              </div>` : `<p class="mt-2 text-sm text-slate-500">Refunded £${Number(t.refundAmount || 0).toFixed(2)}</p>`}
            </div>
          </div>
        </article>
      `).join('');

      list.querySelectorAll('[data-cancel]').forEach((btn) => {
        btn.onclick = async () => {
          if (!confirm('Cancel this ticket? Eligibility rules apply.')) return;
          try {
            const res = await API.post(`/tickets/${btn.dataset.cancel}/cancel`, {});
            flash(res.message, true);
            load();
          } catch (e) { flash(e.message, false); }
        };
      });

      list.querySelectorAll('[data-amend]').forEach((btn) => {
        btn.onclick = () => {
          amendId = btn.dataset.amend;
          const current = btn.dataset.code;
          const sel = document.getElementById('upgrade-select');
          sel.innerHTML = types.ticketTypes
            .filter((x) => ranks[x.code] > ranks[current])
            .map((x) => `<option value="${x.code}">${x.name} (£${x.price})</option>`)
            .join('');
          if (!sel.innerHTML) {
            flash('No higher tier available to upgrade to.', false);
            return;
          }
          document.getElementById('amend-modal').classList.remove('hidden');
        };
      });

      window._types = types;
    }

    document.getElementById('amend-cancel').onclick = () => {
      document.getElementById('amend-modal').classList.add('hidden');
    };
    document.getElementById('amend-confirm').onclick = async () => {
      try {
        const code = document.getElementById('upgrade-select').value;
        const res = await API.post(`/tickets/${amendId}/amend`, { newTicketTypeCode: code });
        document.getElementById('amend-modal').classList.add('hidden');
        flash(res.message, true);
        load();
      } catch (e) { flash(e.message, false); }
    };

    document.getElementById('delete-account-btn').onclick = async () => {
      if (!confirm('Delete your account permanently? All your tickets/orders will be removed from the database.')) return;
      if (!confirm('Final confirmation: this cannot be undone. Continue?')) return;
      try {
        const res = await API.delete('/auth/me');
        Auth.clear();
        Cart.clear();
        flash(res.message, true);
        setTimeout(() => { location.href = '/'; }, 800);
      } catch (e) {
        flash(e.message, false);
      }
    };

    load().catch((e) => flash(e.message, false));
  </script>
</body>
</html>
