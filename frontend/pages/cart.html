<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cart — O2 Tickets</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="site-nav"></div>
  <main class="mx-auto max-w-3xl px-4 py-8">
    <h1 class="text-2xl sm:text-3xl font-extrabold">Your cart</h1>
    <div id="cart-list" class="mt-6 space-y-3"></div>
    <div id="cart-empty" class="hidden mt-8 text-slate-600">
      Cart is empty. <a class="text-rose-700 font-semibold underline" href="/pages/tickets.html">Browse tickets</a>
    </div>
    <div id="cart-footer" class="hidden mt-6 rounded-2xl bg-white border border-slate-200 p-4">
      <div class="flex items-center justify-between font-bold text-lg">
        <span>Subtotal</span>
        <span id="subtotal">£0.00</span>
      </div>
      <p class="mt-1 text-sm text-slate-500">Discounts calculated at checkout for registered users.</p>
      <a href="/pages/checkout.html" class="btn-primary w-full mt-4">Checkout</a>
    </div>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    initNav('cart');
    function render() {
      const items = Cart.get();
      const list = document.getElementById('cart-list');
      const empty = document.getElementById('cart-empty');
      const footer = document.getElementById('cart-footer');
      if (!items.length) {
        list.innerHTML = '';
        empty.classList.remove('hidden');
        footer.classList.add('hidden');
        return;
      }
      empty.classList.add('hidden');
      footer.classList.remove('hidden');
      let sub = 0;
      list.innerHTML = items.map((item, i) => {
        sub += item.price;
        const names = item.attendees.map((a) => `${a.firstName} ${a.lastName}`).join(', ');
        return `
          <article class="ticket-card rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center gap-3 justify-between">
            <div>
              <h2 class="font-extrabold">${item.name}</h2>
              <p class="text-sm text-slate-600 mt-1">${names}</p>
              <p class="font-bold mt-2">£${item.price.toFixed(2)}</p>
            </div>
            <button type="button" data-i="${i}" class="btn-ghost text-sm">Remove</button>
          </article>`;
      }).join('');
      document.getElementById('subtotal').textContent = `£${sub.toFixed(2)}`;
      list.querySelectorAll('button[data-i]').forEach((btn) => {
        btn.onclick = () => { Cart.remove(Number(btn.dataset.i)); render(); };
      });
    }
    render();
  </script>
</body>
</html>
